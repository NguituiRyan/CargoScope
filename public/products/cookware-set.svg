<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="5-Piece Nonstick Cookware Set">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bodyMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="322" cy="80" r="48" fill="#10b981" opacity="0.10"/>
  <circle cx="76" cy="118" r="26" fill="#10b981" opacity="0.08"/>
  <ellipse cx="200" cy="326" rx="94" ry="16" fill="#064e3b" opacity="0.12"/>
  <g>
    <!-- Large pot at bottom -->
    <path d="M132 244 h136 v34 a18 18 0 0 1 -18 18 h-100 a18 18 0 0 1 -18 -18 z" fill="url(#body)"/>
    <path d="M132 244 h28 v52 h-10 a18 18 0 0 1 -18 -18 z" fill="url(#sheen)"/>
    <rect x="146" y="237" width="108" height="11" rx="5" fill="#064e3b" opacity="0.45"/>
    <rect x="92" y="259" width="44" height="10" rx="5" fill="#064e3b" opacity="0.7"/>
    <rect x="264" y="259" width="44" height="10" rx="5" fill="#064e3b" opacity="0.7"/>
    <!-- Medium pan, stacked -->
    <path d="M150 196 h100 v30 a16 16 0 0 1 -16 16 h-68 a16 16 0 0 1 -16 -16 z" fill="url(#bodyMid)"/>
    <path d="M150 196 h22 v46 h-6 a16 16 0 0 1 -16 -16 z" fill="url(#sheen)"/>
    <rect x="162" y="190" width="76" height="9" rx="4" fill="#064e3b" opacity="0.4"/>
    <rect x="250" y="206" width="56" height="9" rx="4" fill="#064e3b" opacity="0.7"/>
    <circle cx="306" cy="210" r="6" fill="#a7f3d0"/>
    <!-- Small frying pan on top with glass lid -->
    <path d="M163 152 h74 v22 a13 13 0 0 1 -13 13 h-48 a13 13 0 0 1 -13 -13 z" fill="url(#body)"/>
    <rect x="172" y="147" width="56" height="8" rx="4" fill="#064e3b" opacity="0.4"/>
    <rect x="94" y="160" width="72" height="9" rx="4" fill="#064e3b" opacity="0.7"/>
    <!-- Glass lid dome -->
    <path d="M168 152 a32 28 0 0 1 64 0 z" fill="url(#lid)"/>
    <path d="M178 150 a22 18 0 0 1 30 -10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <circle cx="200" cy="124" r="6" fill="#064e3b" opacity="0.55"/>
    <rect x="196" y="118" width="8" height="9" rx="3" fill="#047857"/>
  </g>
</svg>
