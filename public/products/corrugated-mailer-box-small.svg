<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Corrugated Mailer Box (Small)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#faf6ef"/><stop offset="1" stop-color="#efe6d8"/></linearGradient>
    <linearGradient id="bodyTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e7d3bd"/><stop offset="1" stop-color="#b08968"/></linearGradient>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08968"/><stop offset="1" stop-color="#7f5539"/></linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a5e3e"/><stop offset="1" stop-color="#7f5539"/></linearGradient>
    <linearGradient id="flapInner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4a373"/><stop offset="1" stop-color="#b08968"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="322" cy="80" r="48" fill="#d4a373" opacity="0.10"/>
  <circle cx="76" cy="118" r="26" fill="#d4a373" opacity="0.09"/>
  <ellipse cx="200" cy="326" rx="94" ry="16" fill="#3a2614" opacity="0.12"/>
  <g>
    <!-- box body: front face -->
    <polygon points="118,168 210,200 210,300 118,272" fill="url(#bodyFront)"/>
    <!-- box body: right side face with fluted edge -->
    <polygon points="210,200 290,170 290,266 210,300" fill="url(#bodySide)"/>
    <!-- box top surface -->
    <polygon points="118,168 200,140 290,170 210,200" fill="url(#bodyTop)"/>
    <!-- fluted corrugated edge along front-right corner -->
    <g stroke="#3a2614" stroke-width="1" opacity="0.4">
      <line x1="210" y1="206" x2="210" y2="298"/>
    </g>
    <g fill="#e7d3bd" opacity="0.55">
      <polygon points="206,201 210,200 210,300 206,299"/>
    </g>
    <!-- corrugated flute scallops on top rim of right side -->
    <g fill="#d4a373" opacity="0.7"><circle cx="222" cy="196" r="2.4"/><circle cx="236" cy="191" r="2.4"/><circle cx="250" cy="186" r="2.4"/><circle cx="264" cy="181" r="2.4"/><circle cx="278" cy="176" r="2.4"/></g>
    <!-- open tuck-top flaps (inner kraft) -->
    <polygon points="118,168 200,140 184,108 102,136" fill="url(#flapInner)"/>
    <polygon points="200,140 290,170 306,138 216,108" fill="#c79a72"/>
    <!-- flap inner shading -->
    <polygon points="118,168 200,140 184,108 102,136" fill="#3a2614" opacity="0.10"/>
    <!-- diagonal kraft hatch texture on front face -->
    <g stroke="#7f5539" stroke-width="0.9" opacity="0.30">
      <line x1="128" y1="186" x2="150" y2="194"/>
      <line x1="128" y1="206" x2="170" y2="220"/>
      <line x1="128" y1="226" x2="195" y2="248"/>
      <line x1="140" y1="252" x2="200" y2="272"/>
    </g>
    <!-- shipping label on front -->
    <polygon points="138,210 188,226 188,254 138,238" fill="#e7d3bd" opacity="0.92"/>
    <g stroke="#7f5539" stroke-width="1.4" opacity="0.55">
      <line x1="146" y1="220" x2="178" y2="231"/>
      <line x1="146" y1="228" x2="172" y2="237"/>
    </g>
    <!-- white sheen highlight overlay on top surface -->
    <polygon points="118,168 200,140 230,150 150,178" fill="url(#sheen)"/>
  </g>
</svg>
