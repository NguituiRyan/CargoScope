<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="4-Piece Airtight Cereal Dispenser Set">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#d1fae5"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a7f3d0" stop-opacity="0.55"/><stop offset="0.5" stop-color="#d1fae5" stop-opacity="0.2"/><stop offset="1" stop-color="#047857" stop-opacity="0.28"/></linearGradient>
    <linearGradient id="cereal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="322" cy="80" r="48" fill="#10b981" opacity="0.10"/>
  <circle cx="76" cy="118" r="26" fill="#10b981" opacity="0.08"/>
  <ellipse cx="200" cy="326" rx="94" ry="16" fill="#064e3b" opacity="0.12"/>
  <g>
    <!-- Left canister -->
    <rect x="118" y="116" width="76" height="188" rx="18" fill="url(#glass)" stroke="#047857" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="124" y="214" width="64" height="84" rx="12" fill="url(#cereal)"/>
    <g fill="#a7f3d0" opacity="0.85"><circle cx="138" cy="238" r="4"/><circle cx="156" cy="252" r="4"/><circle cx="174" cy="236" r="4"/><circle cx="148" cy="272" r="4"/><circle cx="170" cy="268" r="4"/></g>
    <rect x="118" y="116" width="22" height="188" rx="18" fill="url(#sheen)"/>
    <!-- Left lid with pour spout -->
    <rect x="112" y="92" width="88" height="30" rx="11" fill="url(#lid)"/>
    <rect x="178" y="86" width="30" height="20" rx="8" fill="url(#lid)"/>
    <rect x="116" y="96" width="40" height="8" rx="4" fill="#a7f3d0" opacity="0.5"/>

    <!-- Right canister -->
    <rect x="206" y="116" width="76" height="188" rx="18" fill="url(#glass)" stroke="#047857" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="212" y="214" width="64" height="84" rx="12" fill="url(#cereal)"/>
    <g fill="#a7f3d0" opacity="0.85"><circle cx="226" cy="240" r="4"/><circle cx="244" cy="254" r="4"/><circle cx="262" cy="238" r="4"/><circle cx="236" cy="274" r="4"/><circle cx="258" cy="270" r="4"/></g>
    <rect x="206" y="116" width="22" height="188" rx="18" fill="url(#sheen)"/>
    <!-- Right lid with pour spout -->
    <rect x="200" y="92" width="88" height="30" rx="11" fill="url(#lid)"/>
    <rect x="192" y="86" width="30" height="20" rx="8" fill="url(#lid)"/>
    <rect x="244" y="96" width="40" height="8" rx="4" fill="#a7f3d0" opacity="0.5"/>
  </g>
</svg>
