<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Men's Beard Grooming Kit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf2f8"/><stop offset="1" stop-color="#fce7f3"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#be185d"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbcfe8"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#bg)"/>
  <circle cx="322" cy="80" r="48" fill="#ec4899" opacity="0.10"/>
  <circle cx="76" cy="118" r="26" fill="#ec4899" opacity="0.08"/>
  <ellipse cx="200" cy="326" rx="94" ry="16" fill="#831843" opacity="0.12"/>
  <g>
    <!-- Dropper oil bottle -->
    <rect x="118" y="150" width="36" height="120" rx="10" fill="url(#body)"/>
    <rect x="118" y="150" width="15" height="120" rx="10" fill="url(#sheen)"/>
    <rect x="126" y="128" width="20" height="26" rx="4" fill="#831843"/>
    <ellipse cx="136" cy="124" rx="13" ry="7" fill="#fbcfe8"/>
    <rect x="130" y="186" width="12" height="56" rx="6" fill="#fbcfe8" opacity="0.6"/>
    <!-- Balm tin -->
    <ellipse cx="200" cy="250" rx="40" ry="16" fill="#831843"/>
    <rect x="160" y="222" width="80" height="28" fill="url(#tin)"/>
    <ellipse cx="200" cy="222" rx="40" ry="16" fill="url(#tin)"/>
    <ellipse cx="200" cy="222" rx="40" ry="16" fill="url(#sheen)"/>
    <ellipse cx="200" cy="220" rx="24" ry="9" fill="#fbcfe8" opacity="0.55"/>
    <!-- Wooden comb -->
    <rect x="250" y="208" width="74" height="22" rx="6" fill="url(#wood)"/>
    <g fill="#831843"><rect x="256" y="228" width="3" height="20"/><rect x="263" y="228" width="3" height="20"/><rect x="270" y="228" width="3" height="20"/><rect x="277" y="228" width="3" height="20"/><rect x="284" y="228" width="3" height="20"/><rect x="291" y="228" width="3" height="20"/><rect x="298" y="228" width="3" height="20"/><rect x="305" y="228" width="3" height="20"/><rect x="312" y="228" width="3" height="20"/></g>
    <rect x="250" y="208" width="74" height="7" rx="4" fill="#ffffff" opacity="0.4"/>
    <!-- Oval boar-bristle brush -->
    <ellipse cx="180" cy="130" rx="42" ry="24" fill="url(#wood)"/>
    <ellipse cx="180" cy="124" rx="34" ry="16" fill="#831843"/>
    <g stroke="#fbcfe8" stroke-width="2" opacity="0.7"><line x1="158" y1="116" x2="158" y2="102"/><line x1="170" y1="113" x2="170" y2="99"/><line x1="182" y1="112" x2="182" y2="98"/><line x1="194" y1="113" x2="194" y2="99"/><line x1="206" y1="116" x2="206" y2="102"/></g>
    <ellipse cx="168" cy="134" rx="16" ry="6" fill="#ffffff" opacity="0.35"/>
    <!-- Grooming scissors -->
    <g stroke="#be185d" stroke-width="6" fill="none" stroke-linecap="round"><line x1="262" y1="158" x2="306" y2="120"/><line x1="262" y1="120" x2="306" y2="158"/></g>
    <circle cx="262" cy="158" r="9" fill="none" stroke="#831843" stroke-width="5"/>
    <circle cx="262" cy="120" r="9" fill="none" stroke="#831843" stroke-width="5"/>
    <circle cx="284" cy="139" r="3.5" fill="#fbcfe8"/>
  </g>
