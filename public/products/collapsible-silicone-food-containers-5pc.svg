  <g>
    <ellipse cx="208" cy="300" rx="40" ry="10" fill="url(#body)"/>
    <path d="M170 222 q-3 38 0 74 q0 10 38 10 q38 0 38 -10 q3 -36 0 -74 l0 -2 q0 -10 -38 -10 q-38 0 -38 10 z" fill="url(#body)"/>
