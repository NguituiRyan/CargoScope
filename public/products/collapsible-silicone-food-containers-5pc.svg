    <ellipse cx="208" cy="218" rx="32" ry="8" fill="#a7f3d0" opacity="0.45"/>
  </g>

  <!-- Small container (expanded, front) -->
  <g>
    <ellipse cx="262" cy="302" rx="33" ry="9" fill="url(#bodySm)"/>
    <path d="M232 246 q-2 30 0 56 q0 9 30 9 q30 0 30 -9 q2 -26 0 -56 l0 -2 q0 -9 -30 -9 q-30 0 -30 9 z" fill="url(#bodySm)"/>
