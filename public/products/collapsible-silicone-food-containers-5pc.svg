    <g stroke="#064e3b" stroke-width="2" opacity="0.35" fill="none"><path d="M104 262 q44 9 88 0"/><path d="M104 274 q44 9 88 0"/><path d="M104 286 q44 9 88 0"/></g>
    <ellipse cx="148" cy="248" rx="48" ry="13" fill="url(#lid)"/>
    <ellipse cx="148" cy="246" rx="38" ry="9" fill="#a7f3d0" opacity="0.45"/>
  </g>

