  <g>
    <ellipse cx="148" cy="298" rx="46" ry="11" fill="url(#body)"/>
    <path d="M102 252 q4 6 0 12 q4 6 0 12 q4 6 0 12 q4 6 0 10 q0 11 46 11 q46 0 46 -11 q-4 -4 0 -10 q-4 -6 0 -12 q-4 -6 0 -12 q-4 -6 0 -12 l0 -4 q0 -11 -46 -11 q-46 0 -46 11 z" fill="url(#body)"/>
